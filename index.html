<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#1a1a2e"/>
<title>一起听歌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;
  --card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);
  --text:#e8e8e8;--text2:rgba(255,255,255,.5);--text3:rgba(255,255,255,.3);
  --accent:#e94560;--accent2:#ff6b81;--accent-glow:rgba(233,69,96,.4);
  --green:#1db954;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 50%,#0a0a1a 100%);
  color:var(--text);display:flex;flex-direction:column;height:100dvh;position:relative;
}

/* === 顶部状态栏 === */
.top-bar{padding:12px 20px 0;text-align:center;position:relative;z-index:2;}
.top-bar .title{font-size:13px;font-weight:600;color:var(--text2);}

/* === 头像区域 === */
.avatar-zone{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:20px 0 8px;}
.avatars{display:flex;align-items:center;justify-content:center;position:relative;height:80px;width:200px;}
.avatar-wrap{position:absolute;transition:all .8s cubic-bezier(.34,1.56,.64,1);cursor:pointer;}
.avatar-wrap.left{left:20px;}
.avatar-wrap.right{right:20px;}
.avatar-wrap.left.together{left:52px;}
.avatar-wrap.right.together{right:52px;}
.avatar-box{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2.5px solid rgba(255,255,255,.2);
  background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;}
.avatar-box img{width:100%;height:100%;object-fit:cover;}
.avatar-box .letter{font-size:22px;font-weight:700;color:var(--text);}
.avatar-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:5;}
.avatar-name{font-size:11px;color:var(--text2);margin-top:4px;text-align:center;font-weight:600;}

/* 耳机线 */
.headphone-wire{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:30px;
  opacity:0;transition:opacity .6s .3s;pointer-events:none;}
.headphone-wire.show{opacity:1;}
.headphone-wire svg{width:100%;height:100%;}

/* 一起听状态文字 */
.listen-status{margin-top:10px;text-align:center;}
.listen-status .main-text{font-size:13px;color:var(--text2);font-weight:500;line-height:1.6;}
.listen-status .time-text{font-size:12px;color:var(--text3);font-weight:400;margin-top:2px;}

/* === 专辑封面大圆盘 === */
.cover-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;min-height:0;}
.cover-glow{position:absolute;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);
  filter:blur(40px);opacity:0;transition:opacity 1s;}
.cover-glow.on{opacity:.6;}
.cover-disc{width:220px;height:220px;border-radius:50%;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.5);transition:transform .3s;}
.cover-disc.spin{animation:discSpin 12s linear infinite;}
@keyframes discSpin{to{transform:rotate(360deg);}}
.cover-ring{position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.05),transparent 60%);}
.cover-img{position:absolute;inset:8px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#2a2a3e,#1a1a2e);}
.cover-img img{width:100%;height:100%;object-fit:cover;}
.cover-img .placeholder{font-size:48px;color:var(--text3);}
.cover-hole{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;
  background:var(--bg1);border:2px solid rgba(255,255,255,.1);transform:translate(-50%,-50%);z-index:2;}
.song-info{margin-top:20px;text-align:center;padding:0 30px;}
.song-title{font-size:18px;font-weight:700;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;}
.song-artist{font-size:13px;color:var(--text2);margin-top:4px;font-weight:400;}

/* === 进度条 === */
.progress-bar{position:relative;z-index:2;padding:16px 28px 4px;display:flex;align-items:center;gap:10px;}
.progress-bar .time{font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums;min-width:32px;text-align:center;}
.progress-bar .track{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;}
.progress-bar .track-fill{height:100%;border-radius:2px;background:var(--accent);position:absolute;left:0;top:0;pointer-events:none;}
.progress-bar .track-thumb{width:12px;height:12px;border-radius:50%;background:#fff;position:absolute;top:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 6px var(--accent-glow);cursor:pointer;
  opacity:0;transition:opacity .2s;}
.progress-bar .track:hover .track-thumb,
.progress-bar .track:active .track-thumb{opacity:1;}
.progress-bar input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:3;}

/* === 控制按钮 === */
.controls{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:36px;padding:12px 0;}
.ctrl-btn{width:44px;height:44px;border:none;border-radius:50%;background:transparent;
  color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s,color .15s;}
.ctrl-btn:active{transform:scale(.9);}
.ctrl-btn.play-btn{width:56px;height:56px;background:var(--accent);color:#fff;font-size:22px;
  box-shadow:0 4px 20px var(--accent-glow);}
.ctrl-btn.play-btn:active{transform:scale(.92);}

/* === 底部功能栏 === */
.bottom-dock{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-around;
  padding:8px 40px 20px;border-top:1px solid rgba(255,255,255,.05);}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;
  color:var(--text2);cursor:pointer;font-size:10px;font-weight:500;}
.dock-btn .dock-icon{font-size:20px;}
.dock-btn:active{color:var(--accent);}

/* === 歌单面板 === */
.panel-mask{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;}
.panel-mask.on{opacity:1;pointer-events:auto;}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:linear-gradient(180deg,#1e1e32,#14142a);
  border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  max-height:70dvh;display:flex;flex-direction:column;}
.panel.open{transform:translateY(0);}
.panel .grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:10px auto 0;}
.panel .panel-title{text-align:center;font-size:14px;font-weight:700;padding:12px 0 8px;color:var(--text);}
.song-list{overflow-y:auto;padding:0 16px 30px;flex:1;}
.song-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:background .15s;}
.song-item:active{background:var(--card2);}
.song-item.playing{background:var(--card);}
.song-item .song-idx{width:28px;text-align:center;font-size:12px;color:var(--text3);font-weight:600;flex:none;}
.song-item.playing .song-idx{color:var(--accent);}
.song-item .song-meta{flex:1;min-width:0;}
.song-item .song-meta .sname{font-size:14px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.song-item.playing .song-meta .sname{color:var(--accent);}
.song-item .song-meta .sartist{font-size:11px;color:var(--text3);margin-top:2px;}
.song-item .song-dur{font-size:11px;color:var(--text3);flex:none;}

/* === 开始一起听按钮 === */
.join-btn{position:relative;z-index:2;margin:0 auto;padding:10px 32px;border:none;border-radius:24px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 20px var(--accent-glow);transition:transform .15s,opacity .3s;letter-spacing:.5px;}
.join-btn:active{transform:scale(.95);}
.join-btn.hidden{opacity:0;pointer-events:none;position:absolute;}

/* === 隐藏工具 === */
.hidden{display:none!important;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">一起听歌</div>
</div>

<!-- 头像区 -->
<div class="avatar-zone">
  <div class="avatars" id="avatars">
    <div class="avatar-wrap left" id="avatarLeft">
      <div class="avatar-box">
        <span class="letter" id="letterL">蕊</span>
        <input type="file" accept="image/*" id="uploadL" title="更换头像"/>
      </div>
      <div class="avatar-name">蕊蕊</div>
    </div>
    <div class="headphone-wire" id="wire">
      <svg viewBox="0 0 40 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 28 C2 12, 20 4, 20 4 C20 4, 38 12, 38 28" stroke="rgba(255,255,255,.3)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <circle cx="20" cy="3" r="3" fill="rgba(255,255,255,.2)"/>
      </svg>
    </div>
    <div class="avatar-wrap right" id="avatarRight">
      <div class="avatar-box">
        <span class="letter" id="letterR">挚</span>
        <input type="file" accept="image/*" id="uploadR" title="更换头像"/>
      </div>
      <div class="avatar-name">挚</div>
    </div>
  </div>
  <div class="listen-status">
    <div class="main-text" id="statusText">点击下方开始一起听</div>
    <div class="time-text" id="timeText"></div>
  </div>
</div>

<!-- 开始按钮 -->
<button class="join-btn" id="joinBtn">开始一起听</button>

<!-- 封面 -->
<div class="cover-section">
  <div class="cover-glow" id="coverGlow"></div>
  <div class="cover-disc" id="coverDisc">
    <div class="cover-ring"></div>
    <div class="cover-img" id="coverImg">
      <span class="placeholder">&#9835;</span>
    </div>
    <div class="cover-hole"></div>
  </div>
  <div class="song-info">
    <div class="song-title" id="songTitle">还没选歌</div>
    <div class="song-artist" id="songArtist">挑一首，一起听</div>
  </div>
</div>

<!-- 进度条 -->
<div class="progress-bar">
  <span class="time" id="curTime">0:00</span>
  <div class="track" id="trackWrap">
    <div class="track-fill" id="trackFill"></div>
    <div class="track-thumb" id="trackThumb"></div>
    <input type="range" id="seekBar" min="0" max="0" value="0" step="0.1"/>
  </div>
  <span class="time" id="durTime">0:00</span>
</div>

<!-- 控制 -->
<div class="controls">
  <button class="ctrl-btn" id="btnPrev">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
  </button>
  <button class="ctrl-btn play-btn" id="btnPlay">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="8,5 19,12 8,19"/></svg>
  </button>
  <button class="ctrl-btn" id="btnNext">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zm-2-6L5.5 18V6z" transform="rotate(180 12 12)"/></svg>
  </button>
</div>

<!-- 底部 -->
<div class="bottom-dock">
  <button class="dock-btn" id="openPlaylist">
    <span class="dock-icon">&#9835;</span>
    歌单
  </button>
  <button class="dock-btn" id="openSearch">
    <span class="dock-icon">&#128269;</span>
    搜索
  </button>
</div>

<!-- 歌单面板 -->
<div class="panel-mask" id="panelMask"></div>
<div class="panel" id="playlistPanel">
  <div class="grab"></div>
  <div class="panel-title">歌单</div>
  <div class="song-list" id="songList"></div>
</div>

<!-- 搜索面板 -->
<div class="panel" id="searchPanel">
  <div class="grab"></div>
  <div class="panel-title">搜索歌曲</div>
  <div style="padding:8px 16px 12px;display:flex;gap:8px;">
    <input id="searchInput" type="text" placeholder="输入歌名或歌手..."
      style="flex:1;height:38px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
      color:#fff;border-radius:20px;padding:0 16px;font-size:13px;outline:none;"/>
    <button id="searchBtn" style="border:none;background:var(--accent);color:#fff;border-radius:20px;
      padding:0 18px;font-size:13px;font-weight:600;cursor:pointer;">搜</button>
  </div>
  <div class="song-list" id="searchResults"></div>
</div>

<script>
/* =====================================================
   挚和蕊蕊 · 一起听歌 · 网易云风格
   ===================================================== */

// --- 播放列表 ---
const DEFAULT_PLAYLIST = [
  {title:"奶油草莓",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",cover:""},
  {title:"薄荷气泡",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",cover:""},
  {title:"落日汽水",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",cover:""},
  {title:"紫藤晚安",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",cover:""},
  {title:"云朵棉花糖",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",cover:""},
];

let playlist = DEFAULT_PLAYLIST.slice();
let currentIndex = -1;
let isPlaying = false;
let isJoined = false;
let joinTime = 0;
let timerInterval = null;

const audio = new Audio();
audio.preload = "metadata";

const $=id=>document.getElementById(id);

// --- 头像上传 ---
function setupAvatarUpload(inputId, letterId, storageKey){
  const input = $(inputId);
  const letter = $(letterId);
  // load saved
  const saved = localStorage.getItem(storageKey);
  if(saved){
    const img = document.createElement("img");
    img.src = saved;
    letter.replaceWith(img);
  }
  input.addEventListener("change", e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      localStorage.setItem(storageKey, ev.target.result);
      const container = input.parentElement;
      const old = container.querySelector("img") || container.querySelector(".letter");
      if(old){
        const img = document.createElement("img");
        img.src = ev.target.result;
        old.replaceWith(img);
      }
    };
    reader.readAsDataURL(file);
  });
}
setupAvatarUpload("uploadL","letterL","avatar_left");
setupAvatarUpload("uploadR","letterR","avatar_right");

// --- 一起听 ---
$("joinBtn").addEventListener("click", ()=>{
  isJoined = true;
  $("joinBtn").classList.add("hidden");
  // 头像碰头
  $("avatarLeft").classList.add("together");
  $("avatarRight").classList.add("together");
  $("wire").classList.add("show");
  $("statusText").textContent = "TA就在你身边";
  joinTime = Date.now();
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
});

function updateTimer(){
  if(!joinTime) return;
  const diff = Math.floor((Date.now()-joinTime)/1000);
  const h = Math.floor(diff/3600);
  const m = Math.floor((diff%3600)/60);
  const s = diff%60;
  let txt = "一起听了 ";
  if(h>0) txt += h+"小时";
  if(m>0) txt += m+"分钟";
  if(h===0 && m===0) txt += s+"秒";
  $("timeText").textContent = txt;
}

// --- 格式化时间 ---
function fmt(s){
  if(!isFinite(s)||s<0) s=0;
  s=Math.floor(s);
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

// --- 渲染歌单 ---
function renderPlaylist(){
  const list = $("songList");
  list.innerHTML = "";
  playlist.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "song-item"+(i===currentIndex?" playing":"");
    div.innerHTML = `
      <span class="song-idx">${i===currentIndex?"&#9835;":i+1}</span>
      <div class="song-meta">
        <div class="sname">${esc(s.title)}</div>
        <div class="sartist">${esc(s.artist||"")}</div>
      </div>`;
    div.onclick = ()=> selectSong(i);
    list.appendChild(div);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// --- 播放控制 ---
function selectSong(i){
  if(i<0||i>=playlist.length) return;
  currentIndex = i;
  const s = playlist[i];
  $("songTitle").textContent = s.title;
  $("songArtist").textContent = s.artist||"";
  // cover
  const coverImg = $("coverImg");
  if(s.cover){
    coverImg.innerHTML = `<img src="${esc(s.cover)}" alt=""/>`;
  } else {
    coverImg.innerHTML = '<span class="placeholder">&#9835;</span>';
  }
  audio.src = s.url;
  audio.currentTime = 0;
  $("seekBar").max = 0;
  $("seekBar").value = 0;
  $("trackFill").style.width = "0%";
  $("trackThumb").style.left = "0%";
  $("curTime").textContent = "0:00";
  $("durTime").textContent = "0:00";
  renderPlaylist();
  audio.play().then(()=>{
    isPlaying = true;
    updatePlayState();
    $("coverGlow").classList.add("on");
    // 自动加入一起听
    if(!isJoined) $("joinBtn").click();
  }).catch(()=>{isPlaying=false;updatePlayState();});
}

function togglePlay(){
  if(currentIndex<0){selectSong(0);return;}
  if(audio.paused){
    audio.play().then(()=>{isPlaying=true;updatePlayState();$("coverGlow").classList.add("on");}).catch(()=>{});
  } else {
    audio.pause();isPlaying=false;updatePlayState();
  }
}

function updatePlayState(){
  const icon = $("playIcon");
  if(isPlaying){
    icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    $("coverDisc").classList.add("spin");
  } else {
    icon.innerHTML = '<polygon points="8,5 19,12 8,19"/>';
    $("coverDisc").classList.remove("spin");
  }
}

function nextSong(){selectSong((currentIndex+1)%playlist.length);}
function prevSong(){
  if(audio.currentTime>3){audio.currentTime=0;}
  else{selectSong((currentIndex-1+playlist.length)%playlist.length);}
}

// 进度
audio.addEventListener("loadedmetadata",()=>{
  $("seekBar").max = audio.duration||0;
  $("durTime").textContent = fmt(audio.duration);
});
audio.addEventListener("timeupdate",()=>{
  if(!isSeeking){
    const cur = audio.currentTime;
    const dur = audio.duration||1;
    $("seekBar").value = cur;
    $("curTime").textContent = fmt(cur);
    const pct = (cur/dur*100)+"%";
    $("trackFill").style.width = pct;
    $("trackThumb").style.left = pct;
  }
});
audio.addEventListener("ended",nextSong);

let isSeeking = false;
$("seekBar").addEventListener("input",()=>{
  isSeeking=true;
  const val = $("seekBar").value;
  $("curTime").textContent = fmt(val);
  const dur = audio.duration||1;
  const pct = (val/dur*100)+"%";
  $("trackFill").style.width = pct;
  $("trackThumb").style.left = pct;
});
$("seekBar").addEventListener("change",()=>{
  audio.currentTime = $("seekBar").value;
  isSeeking=false;
});

$("btnPlay").addEventListener("click",togglePlay);
$("btnPrev").addEventListener("click",prevSong);
$("btnNext").addEventListener("click",nextSong);

// --- 面板 ---
const mask = $("panelMask");
function closeAllPanels(){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("open"));
  mask.classList.remove("on");
}
function togglePanel(panel){
  const isOpen = panel.classList.contains("open");
  closeAllPanels();
  if(!isOpen){panel.classList.add("open");mask.classList.add("on");}
}
$("openPlaylist").addEventListener("click",()=>{renderPlaylist();togglePanel($("playlistPanel"));});
$("openSearch").addEventListener("click",()=>togglePanel($("searchPanel")));
mask.addEventListener("click",closeAllPanels);

// --- 搜索（预留） ---
$("searchBtn").addEventListener("click",doSearch);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});
function doSearch(){
  const q = $("searchInput").value.trim();
  if(!q) return;
  const results = $("searchResults");
  results.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">搜索功能接入中，敬请期待</div>';
}

// --- 初始化 ---
renderPlaylist();
updatePlayState();
</script>
</body>
</html>
