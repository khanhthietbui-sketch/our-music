<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0c0c14"/>
<title>一起听歌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg1:#0c0c14;--bg2:#111119;--bg3:#18182a;
  --card:rgba(255,255,255,.04);--card2:rgba(255,255,255,.08);
  --text:#ececec;--text2:rgba(255,255,255,.45);--text3:rgba(255,255,255,.25);
  --accent:#e94560;--accent2:#ff6b81;--accent-glow:rgba(233,69,96,.35);
  --vinyl-dark:#0a0a0f;--vinyl-mid:#151520;--vinyl-groove:rgba(255,255,255,.03);
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg1);
  color:var(--text);display:flex;flex-direction:column;height:100dvh;position:relative;
  overflow:hidden;
}
/* 背景氛围光 */
.ambience{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.ambience .a1{position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,69,96,.12),transparent 70%);top:-80px;right:-80px;filter:blur(60px);}
.ambience .a2{position:absolute;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,rgba(100,80,200,.1),transparent 70%);bottom:40px;left:-60px;filter:blur(50px);}

/* === 顶部 === */
.top-bar{padding:14px 20px 0;text-align:center;position:relative;z-index:2;}
.top-bar .title{font-size:13px;font-weight:500;color:var(--text3);letter-spacing:1px;}

/* === 头像区域 === */
.avatar-zone{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:16px 0 4px;}
.avatars{display:flex;align-items:center;justify-content:center;position:relative;height:80px;width:220px;}

.avatar-wrap{position:absolute;transition:all .8s cubic-bezier(.25,1,.5,1);cursor:pointer;display:flex;flex-direction:column;align-items:center;}
/* 分开状态 */
.avatar-wrap.left{left:24px;}
.avatar-wrap.right{right:24px;}
/* 碰头状态：刚好挨着没缝隙，两个64px头像中间无gap */
.avatar-wrap.left.together{left:44px;}
.avatar-wrap.right.together{right:44px;}

.avatar-box{width:64px;height:64px;border-radius:50%;overflow:hidden;
  border:2px solid rgba(255,255,255,.15);
  background:var(--bg3);display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 4px 16px rgba(0,0,0,.4);}
.avatar-box img{width:100%;height:100%;object-fit:cover;}
.avatar-box .letter{font-size:20px;font-weight:700;color:var(--text2);}
.avatar-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:5;}
.avatar-name{font-size:10px;color:var(--text3);margin-top:4px;text-align:center;font-weight:500;}

/* 耳机线 */
.headphone-wire{position:absolute;top:32px;left:50%;transform:translateX(-50%);width:50px;height:36px;
  opacity:0;transition:opacity .5s .4s;pointer-events:none;z-index:3;}
.headphone-wire.show{opacity:1;}
.headphone-wire svg{width:100%;height:100%;}

/* 状态文字 */
.listen-status{margin-top:8px;text-align:center;min-height:36px;}
.listen-status .main-text{font-size:12px;color:var(--text2);font-weight:400;line-height:1.6;}
.listen-status .time-text{font-size:11px;color:var(--text3);font-weight:400;margin-top:1px;}

/* === 唱片区 === */
.cover-section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1;min-height:0;}

/* 氛围光晕 */
.cover-glow{position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(233,69,96,.2) 0%,rgba(100,60,180,.1) 40%,transparent 70%);
  filter:blur(50px);opacity:0;transition:opacity 1.2s;}
.cover-glow.on{opacity:1;}

/* 唱片主体 */
.cover-disc{width:240px;height:240px;border-radius:50%;position:relative;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04),
    0 2px 4px rgba(0,0,0,.4),
    0 8px 24px rgba(0,0,0,.5),
    0 24px 48px rgba(0,0,0,.4);
}
.cover-disc.spin{animation:discSpin 16s linear infinite;}
@keyframes discSpin{to{transform:rotate(360deg);}}

/* 黑胶纹理 */
.vinyl{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#1a1a28,var(--vinyl-dark) 55%,#060608);
  overflow:hidden;}
.vinyl-grooves{position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle at center,
    transparent 0px,transparent 2.5px,
    var(--vinyl-groove) 2.5px,var(--vinyl-groove) 3px);
}
.vinyl-sheen{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0deg,rgba(255,255,255,.06) 40deg,transparent 80deg,
    transparent 180deg,rgba(255,255,255,.04) 220deg,transparent 260deg);
}
.vinyl-edge{position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.08);}

/* 中心封面 */
.cover-label{position:absolute;inset:60px;border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 2px rgba(255,255,255,.08),0 4px 16px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1e1e30,#141420);}
.cover-label img{width:100%;height:100%;object-fit:cover;}
.cover-label .placeholder{font-size:36px;color:var(--text3);}

/* 唱片中心孔 */
.cover-hole{position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:50%;
  background:var(--bg1);border:1.5px solid rgba(255,255,255,.08);transform:translate(-50%,-50%);z-index:2;}

/* 歌曲信息 */
.song-info{margin-top:18px;text-align:center;padding:0 30px;}
.song-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;}
.song-artist{font-size:12px;color:var(--text2);margin-top:3px;font-weight:400;}

/* === 进度条 === */
.progress-bar{position:relative;z-index:2;padding:14px 28px 2px;display:flex;align-items:center;gap:10px;}
.progress-bar .time{font-size:10px;color:var(--text3);font-variant-numeric:tabular-nums;min-width:32px;text-align:center;}
.progress-bar .track{flex:1;height:2px;border-radius:1px;background:rgba(255,255,255,.1);position:relative;cursor:pointer;}
.progress-bar .track-fill{height:100%;border-radius:1px;background:var(--accent);position:absolute;left:0;top:0;pointer-events:none;transition:width .1s linear;}
.progress-bar .track-thumb{width:10px;height:10px;border-radius:50%;background:#fff;position:absolute;top:50%;
  transform:translate(-50%,-50%);box-shadow:0 0 8px var(--accent-glow);cursor:pointer;
  opacity:0;transition:opacity .2s;}
.progress-bar .track:hover .track-thumb,
.progress-bar .track:active .track-thumb{opacity:1;}
.progress-bar input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:3;margin:0;}

/* === 控制按钮 === */
.controls{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:40px;padding:10px 0 6px;}
.ctrl-btn{width:40px;height:40px;border:none;border-radius:50%;background:transparent;
  color:rgba(255,255,255,.7);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .12s,color .12s;}
.ctrl-btn:active{transform:scale(.88);color:#fff;}
.ctrl-btn.play-btn{width:52px;height:52px;background:var(--accent);color:#fff;
  box-shadow:0 4px 20px var(--accent-glow);border:none;}
.ctrl-btn.play-btn:active{transform:scale(.9);}

/* === 底部功能栏 === */
.bottom-dock{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-around;
  padding:6px 30px 18px;}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;
  color:var(--text3);cursor:pointer;font-size:9px;font-weight:500;transition:color .15s;}
.dock-btn .dock-icon{font-size:18px;transition:color .15s;}
.dock-btn:active,.dock-btn:active .dock-icon{color:var(--accent);}

/* === 面板通用 === */
.panel-mask{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px);}
.panel-mask.on{opacity:1;pointer-events:auto;}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:linear-gradient(180deg,#16162a,#0e0e1a);
  border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  max-height:72dvh;display:flex;flex-direction:column;}
.panel.open{transform:translateY(0);}
.panel .grab{width:36px;height:3.5px;border-radius:2px;background:rgba(255,255,255,.12);margin:10px auto 0;}
.panel .panel-title{text-align:center;font-size:14px;font-weight:600;padding:12px 0 8px;color:var(--text);}

/* 歌单 */
.song-list{overflow-y:auto;padding:0 16px 30px;flex:1;}
.song-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:background .15s;}
.song-item:active{background:var(--card2);}
.song-item.playing{background:var(--card);}
.song-item .song-idx{width:28px;text-align:center;font-size:12px;color:var(--text3);font-weight:500;flex:none;}
.song-item.playing .song-idx{color:var(--accent);}
.song-item .song-meta{flex:1;min-width:0;}
.song-item .song-meta .sname{font-size:13px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.song-item.playing .song-meta .sname{color:var(--accent2);}
.song-item .song-meta .sartist{font-size:11px;color:var(--text3);margin-top:2px;}

/* === 歌词面板 === */
.lyrics-panel{position:fixed;left:0;right:0;bottom:0;top:0;z-index:25;
  background:var(--bg1);
  transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;}
.lyrics-panel.open{transform:translateY(0);}
.lyrics-header{display:flex;align-items:center;padding:14px 18px 8px;flex:none;}
.lyrics-close{border:none;background:none;color:var(--text2);font-size:22px;cursor:pointer;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  transition:background .15s;}
.lyrics-close:active{background:var(--card2);}
.lyrics-header .lyrics-song{flex:1;text-align:center;}
.lyrics-header .lyrics-song .lt{font-size:15px;font-weight:700;color:var(--text);}
.lyrics-header .lyrics-song .la{font-size:11px;color:var(--text2);margin-top:2px;}
.lyrics-body{flex:1;overflow-y:auto;padding:20px 30px 40px;display:flex;flex-direction:column;align-items:center;gap:18px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,black 15%,black 85%,transparent 100%);}
.lyric-line{font-size:15px;color:var(--text3);text-align:center;line-height:1.8;
  transition:color .4s,font-size .4s,transform .4s;font-weight:400;}
.lyric-line.active{color:var(--text);font-size:18px;font-weight:700;transform:scale(1.02);}
.lyrics-mini-ctrl{padding:12px 20px 20px;display:flex;align-items:center;justify-content:center;gap:32px;flex:none;
  border-top:1px solid rgba(255,255,255,.04);}
.lyrics-mini-ctrl .ctrl-btn{width:36px;height:36px;}
.lyrics-mini-ctrl .ctrl-btn.play-btn{width:46px;height:46px;}

.hidden{display:none!important;}
</style>
</head>
<body>

<div class="ambience"><div class="a1"></div><div class="a2"></div></div>

<div class="top-bar">
  <div class="title">一起听歌</div>
</div>

<!-- 头像区 -->
<div class="avatar-zone">
  <div class="avatars" id="avatars">
    <div class="avatar-wrap left" id="avatarLeft">
      <div class="avatar-box">
        <span class="letter" id="letterL">蕊</span>
        <input type="file" accept="image/*" id="uploadL" title="更换头像"/>
      </div>
      <div class="avatar-name">蕊蕊</div>
    </div>
    <div class="headphone-wire" id="wire">
      <svg viewBox="0 0 50 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 32 C4 10, 25 2, 25 2 C25 2, 46 10, 46 32" stroke="rgba(255,255,255,.2)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
        <circle cx="25" cy="2" r="2.5" fill="rgba(255,255,255,.15)"/>
        <circle cx="4" cy="32" r="2" fill="rgba(255,255,255,.12)"/>
        <circle cx="46" cy="32" r="2" fill="rgba(255,255,255,.12)"/>
      </svg>
    </div>
    <div class="avatar-wrap right" id="avatarRight">
      <div class="avatar-box">
        <span class="letter" id="letterR">挚</span>
        <input type="file" accept="image/*" id="uploadR" title="更换头像"/>
      </div>
      <div class="avatar-name">挚</div>
    </div>
  </div>
  <div class="listen-status">
    <div class="main-text" id="statusText">选一首歌，开始一起听</div>
    <div class="time-text" id="timeText"></div>
  </div>
</div>

<!-- 唱片 -->
<div class="cover-section">
  <div class="cover-glow" id="coverGlow"></div>
  <div class="cover-disc" id="coverDisc">
    <div class="vinyl">
      <div class="vinyl-grooves"></div>
      <div class="vinyl-sheen"></div>
    </div>
    <div class="vinyl-edge"></div>
    <div class="cover-label" id="coverLabel">
      <span class="placeholder">&#9835;</span>
    </div>
    <div class="cover-hole"></div>
  </div>
  <div class="song-info">
    <div class="song-title" id="songTitle">还没选歌</div>
    <div class="song-artist" id="songArtist">挑一首，一起听</div>
  </div>
</div>

<!-- 进度条 -->
<div class="progress-bar">
  <span class="time" id="curTime">0:00</span>
  <div class="track" id="trackWrap">
    <div class="track-fill" id="trackFill"></div>
    <div class="track-thumb" id="trackThumb"></div>
    <input type="range" id="seekBar" min="0" max="0" value="0" step="0.1"/>
  </div>
  <span class="time" id="durTime">0:00</span>
</div>

<!-- 控制 -->
<div class="controls">
  <button class="ctrl-btn" id="btnPrev">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
  </button>
  <button class="ctrl-btn play-btn" id="btnPlay">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="8,5 19,12 8,19"/></svg>
  </button>
  <button class="ctrl-btn" id="btnNext">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zm-2-6L5.5 18V6z" transform="rotate(180 12 12)"/></svg>
  </button>
</div>

<!-- 底部 -->
<div class="bottom-dock">
  <button class="dock-btn" id="openPlaylist">
    <span class="dock-icon">&#9835;</span>歌单
  </button>
  <button class="dock-btn" id="openLyrics">
    <span class="dock-icon">&#9998;</span>歌词
  </button>
  <button class="dock-btn" id="openSearch">
    <span class="dock-icon">&#128269;</span>搜索
  </button>
</div>

<!-- 歌单面板 -->
<div class="panel-mask" id="panelMask"></div>
<div class="panel" id="playlistPanel">
  <div class="grab"></div>
  <div class="panel-title">歌单</div>
  <div class="song-list" id="songList"></div>
</div>

<!-- 搜索面板 -->
<div class="panel" id="searchPanel">
  <div class="grab"></div>
  <div class="panel-title">搜索歌曲</div>
  <div style="padding:8px 16px 12px;display:flex;gap:8px;">
    <input id="searchInput" type="text" placeholder="输入歌名或歌手..."
      style="flex:1;height:38px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
      color:#fff;border-radius:20px;padding:0 16px;font-size:13px;outline:none;"/>
    <button id="searchBtn" style="border:none;background:var(--accent);color:#fff;border-radius:20px;
      padding:0 18px;font-size:13px;font-weight:600;cursor:pointer;">搜</button>
  </div>
  <div class="song-list" id="searchResults"></div>
</div>

<!-- 歌词全屏面板 -->
<div class="lyrics-panel" id="lyricsPanel">
  <div class="lyrics-header">
    <button class="lyrics-close" id="lyricsClose">&#10005;</button>
    <div class="lyrics-song">
      <div class="lt" id="lyricTitle">--</div>
      <div class="la" id="lyricArtist">--</div>
    </div>
    <div style="width:36px;"></div>
  </div>
  <div class="lyrics-body" id="lyricsBody">
    <div class="lyric-line" style="color:var(--text2);">暂无歌词</div>
  </div>
  <div class="lyrics-mini-ctrl">
    <button class="ctrl-btn" id="lyPrev">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-btn" id="lyPlay">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="lyPlayIcon"><polygon points="8,5 19,12 8,19"/></svg>
    </button>
    <button class="ctrl-btn" id="lyNext">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zm-2-6L5.5 18V6z" transform="rotate(180 12 12)"/></svg>
    </button>
  </div>
</div>

<script>
/* =====================================================
   挚和蕊蕊 · 一起听歌 · 网易云风格 v2
   ===================================================== */

const DEFAULT_PLAYLIST = [
  {title:"奶油草莓",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",cover:"",
   lyrics:[{t:0,l:"纯音乐，请欣赏"}]},
  {title:"薄荷气泡",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",cover:"",
   lyrics:[{t:0,l:"纯音乐，请欣赏"}]},
  {title:"落日汽水",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",cover:"",
   lyrics:[{t:0,l:"纯音乐，请欣赏"}]},
  {title:"紫藤晚安",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",cover:"",
   lyrics:[{t:0,l:"纯音乐，请欣赏"}]},
  {title:"云朵棉花糖",artist:"SoundHelix",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",cover:"",
   lyrics:[{t:0,l:"纯音乐，请欣赏"}]},
];

let playlist = DEFAULT_PLAYLIST.slice();
let currentIndex = -1;
let isPlaying = false;
let joinTime = 0;
let timerInterval = null;

const audio = new Audio();
audio.preload = "metadata";
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

/* --- 头像上传 --- */
function setupAvatar(inputId,letterId,key){
  const input=$(inputId), letter=$(letterId);
  const saved=localStorage.getItem(key);
  if(saved){const img=document.createElement("img");img.src=saved;letter.replaceWith(img);}
  input.addEventListener("change",e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      localStorage.setItem(key,ev.target.result);
      const box=input.parentElement;
      const old=box.querySelector("img")||box.querySelector(".letter");
      if(old){const img=document.createElement("img");img.src=ev.target.result;old.replaceWith(img);}
    };
    reader.readAsDataURL(file);
  });
}
setupAvatar("uploadL","letterL","avatar_left");
setupAvatar("uploadR","letterR","avatar_right");

/* --- 头像碰头/分开 --- */
function avatarsTogether(){
  $("avatarLeft").classList.add("together");
  $("avatarRight").classList.add("together");
  $("wire").classList.add("show");
  $("statusText").textContent="TA就在你身边";
  if(!joinTime){
    joinTime=Date.now();
    timerInterval=setInterval(updateTimer,1000);
    updateTimer();
  }
}
function avatarsApart(){
  $("avatarLeft").classList.remove("together");
  $("avatarRight").classList.remove("together");
  $("wire").classList.remove("show");
  $("statusText").textContent="暂停中";
}

function updateTimer(){
  if(!joinTime)return;
  const diff=Math.floor((Date.now()-joinTime)/1000);
  const h=Math.floor(diff/3600),m=Math.floor((diff%3600)/60),s=diff%60;
  let txt="一起听了 ";
  if(h>0)txt+=h+"小时";
  if(m>0)txt+=m+"分钟";
  if(h===0&&m===0)txt+=s+"秒";
  $("timeText").textContent=txt;
}

/* --- 歌单渲染 --- */
function renderPlaylist(){
  const list=$("songList"); list.innerHTML="";
  playlist.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="song-item"+(i===currentIndex?" playing":"");
    div.innerHTML=`<span class="song-idx">${i===currentIndex?"&#9835;":i+1}</span>
      <div class="song-meta"><div class="sname">${esc(s.title)}</div><div class="sartist">${esc(s.artist||"")}</div></div>`;
    div.onclick=()=>selectSong(i);
    list.appendChild(div);
  });
}

/* --- 播放 --- */
function selectSong(i){
  if(i<0||i>=playlist.length)return;
  currentIndex=i;
  const s=playlist[i];
  $("songTitle").textContent=s.title;
  $("songArtist").textContent=s.artist||"";
  $("lyricTitle").textContent=s.title;
  $("lyricArtist").textContent=s.artist||"";
  // cover
  const label=$("coverLabel");
  if(s.cover){label.innerHTML=`<img src="${esc(s.cover)}" alt=""/>`;}
  else{label.innerHTML='<span class="placeholder">&#9835;</span>';}
  audio.src=s.url; audio.currentTime=0;
  $("seekBar").max=0;$("seekBar").value=0;
  $("trackFill").style.width="0%";$("trackThumb").style.left="0%";
  $("curTime").textContent="0:00";$("durTime").textContent="0:00";
  renderPlaylist(); renderLyrics(s);
  audio.play().then(()=>{isPlaying=true;onPlayStateChange();$("coverGlow").classList.add("on");})
    .catch(()=>{isPlaying=false;onPlayStateChange();});
}

function togglePlay(){
  if(currentIndex<0){selectSong(0);return;}
  if(audio.paused){
    audio.play().then(()=>{isPlaying=true;onPlayStateChange();$("coverGlow").classList.add("on");}).catch(()=>{});
  }else{
    audio.pause();isPlaying=false;onPlayStateChange();
  }
}

function onPlayStateChange(){
  // 播放图标
  const setIcon=(el)=>{
    if(isPlaying)el.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    else el.innerHTML='<polygon points="8,5 19,12 8,19"/>';
  };
  setIcon($("playIcon"));
  setIcon($("lyPlayIcon"));
  // 唱片旋转
  if(isPlaying){$("coverDisc").classList.add("spin");avatarsTogether();}
  else{$("coverDisc").classList.remove("spin");avatarsApart();}
}

function nextSong(){selectSong((currentIndex+1)%playlist.length);}
function prevSong(){if(audio.currentTime>3)audio.currentTime=0;else selectSong((currentIndex-1+playlist.length)%playlist.length);}

// 进度
audio.addEventListener("loadedmetadata",()=>{$("seekBar").max=audio.duration||0;$("durTime").textContent=fmt(audio.duration);});
audio.addEventListener("timeupdate",()=>{
  if(!isSeeking){
    const cur=audio.currentTime,dur=audio.duration||1;
    $("seekBar").value=cur;$("curTime").textContent=fmt(cur);
    const pct=(cur/dur*100)+"%";
    $("trackFill").style.width=pct;$("trackThumb").style.left=pct;
    updateActiveLyric(cur);
  }
});
audio.addEventListener("ended",nextSong);

let isSeeking=false;
$("seekBar").addEventListener("input",()=>{
  isSeeking=true;const val=$("seekBar").value;$("curTime").textContent=fmt(val);
  const dur=audio.duration||1,pct=(val/dur*100)+"%";
  $("trackFill").style.width=pct;$("trackThumb").style.left=pct;
});
$("seekBar").addEventListener("change",()=>{audio.currentTime=$("seekBar").value;isSeeking=false;});

$("btnPlay").addEventListener("click",togglePlay);
$("btnPrev").addEventListener("click",prevSong);
$("btnNext").addEventListener("click",nextSong);
$("lyPlay").addEventListener("click",togglePlay);
$("lyPrev").addEventListener("click",prevSong);
$("lyNext").addEventListener("click",nextSong);

/* --- 面板 --- */
const mask=$("panelMask");
function closeAllPanels(){document.querySelectorAll(".panel").forEach(p=>p.classList.remove("open"));mask.classList.remove("on");}
function togglePanel(p){const o=p.classList.contains("open");closeAllPanels();if(!o){p.classList.add("open");mask.classList.add("on");}}
$("openPlaylist").addEventListener("click",()=>{renderPlaylist();togglePanel($("playlistPanel"));});
$("openSearch").addEventListener("click",()=>togglePanel($("searchPanel")));
mask.addEventListener("click",closeAllPanels);

/* --- 歌词面板 --- */
$("openLyrics").addEventListener("click",()=>{$("lyricsPanel").classList.add("open");});
$("lyricsClose").addEventListener("click",()=>{$("lyricsPanel").classList.remove("open");});

let currentLyrics=[];
function renderLyrics(song){
  const body=$("lyricsBody"); body.innerHTML="";
  currentLyrics=song.lyrics||[];
  if(!currentLyrics.length){
    body.innerHTML='<div class="lyric-line" style="color:var(--text2);">暂无歌词</div>';
    return;
  }
  currentLyrics.forEach((line,i)=>{
    const div=document.createElement("div");
    div.className="lyric-line";
    div.dataset.idx=i;
    div.textContent=line.l;
    body.appendChild(div);
  });
}

function updateActiveLyric(time){
  if(!currentLyrics.length)return;
  let activeIdx=0;
  for(let i=currentLyrics.length-1;i>=0;i--){
    if(time>=currentLyrics[i].t){activeIdx=i;break;}
  }
  const lines=$("lyricsBody").querySelectorAll(".lyric-line");
  lines.forEach((el,i)=>{
    if(i===activeIdx){
      if(!el.classList.contains("active")){
        el.classList.add("active");
        el.scrollIntoView({behavior:"smooth",block:"center"});
      }
    }else{el.classList.remove("active");}
  });
}

/* --- 搜索（预留） --- */
$("searchBtn").addEventListener("click",doSearch);
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});
function doSearch(){
  const q=$("searchInput").value.trim();if(!q)return;
  $("searchResults").innerHTML='<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;">搜索功能接入中</div>';
}

/* --- 初始化 --- */
renderPlaylist();
onPlayStateChange();
</script>
</body>
</html>
