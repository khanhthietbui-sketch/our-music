<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0c0c14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="一起听歌"/>
<link rel="apple-touch-icon" href="https://i.ibb.co/tpyh6Ywy/IMG-6503.jpg"/>
<link rel="manifest" href="manifest.json"/>
<title>一起听歌</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="ambience"><div class="a1"></div><div class="a2"></div></div>
<div class="top-bar"><div class="title">一起听歌</div></div>
<div class="avatar-zone">
  <div class="avatars-row">
    <div class="avatar-wrap left" id="avatarLeft">
      <div class="avatar-box"><span class="letter" id="letterL">蕊</span><input type="file" accept="image/*" id="uploadL" title=""/></div>
      <div class="avatar-name">蕊蕊</div>
      <svg class="wire wire-l" id="wireL" viewBox="0 0 28 38" fill="none"><path d="M24 2C20 6,14 14,10 22C7 28,5 33,4 36" stroke="rgba(255,255,255,.25)" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="24" cy="2" r="2" fill="rgba(255,255,255,.2)"/><circle cx="4" cy="36" r="2.5" fill="rgba(255,255,255,.12)"/></svg>
    </div>
    <div class="avatar-wrap right" id="avatarRight">
      <div class="avatar-box"><span class="letter" id="letterR">挚</span><input type="file" accept="image/*" id="uploadR" title=""/></div>
      <div class="avatar-name">挚</div>
      <svg class="wire wire-r" id="wireR" viewBox="0 0 28 38" fill="none"><path d="M4 2C8 6,14 14,18 22C21 28,23 33,24 36" stroke="rgba(255,255,255,.25)" stroke-width="1.5" stroke-linecap="round" fill="none"/><circle cx="4" cy="2" r="2" fill="rgba(255,255,255,.2)"/><circle cx="24" cy="36" r="2.5" fill="rgba(255,255,255,.12)"/></svg>
    </div>
  </div>
  <div class="listen-status">
    <div class="main-text" id="statusText">选一首歌，开始一起听</div>
    <div class="time-text" id="timeText"></div>
  </div>
</div>
<div class="cover-section">
  <div class="cover-glow" id="coverGlow"></div>
  <div class="cover-disc" id="coverDisc">
    <div class="vinyl"><div class="vinyl-grooves"></div><div class="vinyl-sheen"></div></div>
    <div class="vinyl-edge"></div>
    <div class="cover-label" id="coverLabel"><span class="placeholder">&#9835;</span></div>
    <div class="cover-hole"></div>
  </div>
  <div class="song-info">
    <div class="song-title" id="songTitle">还没选歌</div>
    <div class="song-artist" id="songArtist">挑一首，一起听</div>
  </div>
</div>
<div class="progress-bar">
  <span class="time" id="curTime">0:00</span>
  <div class="track" id="trackWrap">
    <div class="track-fill" id="trackFill"></div>
    <div class="track-thumb" id="trackThumb"></div>
    <input type="range" id="seekBar" min="0" max="0" value="0" step="0.1"/>
  </div>
  <span class="time" id="durTime">0:00</span>
</div>
<div class="controls">
  <button class="ctrl-btn" id="btnPrev"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
  <button class="ctrl-btn play-btn" id="btnPlay"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><polygon points="8,5 19,12 8,19"/></svg></button>
  <button class="ctrl-btn" id="btnNext"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zm-2-6L5.5 18V6z" transform="rotate(180 12 12)"/></svg></button>
</div>
<div class="bottom-dock">
  <button class="dock-btn" id="openPlaylist"><span class="dock-icon">&#9835;</span>歌单</button>
  <button class="dock-btn" id="openLyrics"><span class="dock-icon">&#9998;</span>歌词</button>
  <button class="dock-btn" id="openSearch"><span class="dock-icon">&#128269;</span>搜索</button>
</div>
<div class="panel-mask" id="panelMask"></div>
<div class="panel" id="playlistPanel"><div class="grab"></div><div class="panel-title">歌单</div><div class="song-list" id="songList"></div></div>
<div class="panel" id="searchPanel">
  <div class="grab"></div><div class="panel-title">搜索歌曲</div>
  <div style="padding:8px 16px 12px;display:flex;gap:8px;">
    <input id="searchInput" type="text" placeholder="输入歌名或歌手..." style="flex:1;height:38px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;border-radius:20px;padding:0 16px;font-size:13px;outline:none;"/>
    <button id="searchBtn" style="border:none;background:var(--accent);color:#fff;border-radius:20px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer;">搜</button>
  </div>
  <div class="song-list" id="searchResults"></div>
</div>
<div class="lyrics-panel" id="lyricsPanel">
  <div class="lyrics-header">
    <button class="lyrics-close" id="lyricsClose">&#10005;</button>
    <div class="lyrics-song"><div class="lt" id="lyricTitle">--</div><div class="la" id="lyricArtist">--</div></div>
    <div style="width:36px;"></div>
  </div>
  <div class="lyrics-body" id="lyricsBody"><div class="lyric-line" style="color:var(--text2);">暂无歌词</div></div>
  <div class="lyrics-mini-ctrl">
    <button class="ctrl-btn" id="lyPrev"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="ctrl-btn play-btn" id="lyPlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="lyPlayIcon"><polygon points="8,5 19,12 8,19"/></svg></button>
    <button class="ctrl-btn" id="lyNext"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zm-2-6L5.5 18V6z" transform="rotate(180 12 12)"/></svg></button>
  </div>
</div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
</html>
